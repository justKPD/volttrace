[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "volttrace"
version = "0.5.0"
description = "Falsification-driven, margin-aware SiL-first validation of HV energy management (synthetic)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["numpy>=1.26", "pyyaml>=6", "cantools>=39"]

[project.optional-dependencies]
mdf = ["asammdf>=7.4"]
dev = ["pytest>=8", "ruff>=0.6", "asammdf>=7.4"]

[project.scripts]
volttrace = "volttrace.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/volttrace"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["SIM108"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# embedded HTML/CSS/JS template and report prose
"src/volttrace/htmlreport.py" = ["E501"]
"scripts/*" = ["E501"]
