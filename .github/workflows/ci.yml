name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Static checks
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Unit + end-to-end tests
        run: pytest -q

  validation-pipeline:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: "Pipeline: static checks -> lint -> SiL run -> gate"
        run: volttrace pipeline --out out
      - name: Mutation kill matrix
        run: volttrace mutants --out out
      - name: "Falsification: regen template on the released SUT (must find no counterexample)"
        run: volttrace falsify falsify/FZ-003_regen.yaml --strategy cem --budget 48 --seed 1 --out out
      - name: "Falsification: same template against mutant M09 (must rediscover F-002; exit 2 = found)"
        run: |
          set +e
          volttrace falsify falsify/FZ-003_regen.yaml --sut M09SopAssumesNewPack --strategy cem --budget 48 --seed 1 --out out
          test $? -eq 2
      - name: "Orchestration benchmark A/B/C (seed set 0) + exact reproduction check"
        run: |
          volttrace bench --seeds 0 --out out
          python scripts/check_reproduction.py out/benchmark.json
      - name: Job summary
        if: always()
        run: cat out/pipeline.md out/summary_baseline.md out/mutation_matrix.md out/benchmark.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-evidence
          path: out/
