# Change-impact map: which features a modification of an EMS symbol touches.
# The orchestrator derives a change's features from the methods and calibration keys
# it modifies. Nobody hand-labels a change, the way a CODEOWNERS-style map works on a real repo.
methods:
  step:              [startup, torque_arbitration, diagnostics, voltage_guard]
  soc_discharge_kw:  [discharge_limit]
  soc_charge_kw:     [charge_limit, regen]
  cold_factors:      [discharge_limit, charge_limit, cold]
  _ramp:             [thermal_derating]
  derate_factor:     [thermal_derating]
  voltage_guard:     [voltage_guard]
  _guard_integrate:  [voltage_guard]
  r_nominal:         [charge_limit, regen]
  update_resistance: [charge_limit, regen]
  r_for_sop:         [charge_limit, regen]
  charge_sop:        [charge_limit, regen]
  diagnose:          [diagnostics, can]
  torque_limits:     [torque_arbitration, discharge_limit, charge_limit]
  regen_fade:        [regen, brake_blending]
  rate_limit:        [torque_arbitration, driveability, brake_blending]
  blend_friction:    [brake_blending, regen]
# calibration keys, matched by prefix
calibration:
  can_timeout:          [diagnostics, can]
  diag_startup:         [diagnostics, startup]
  t_bat_plaus:          [diagnostics]
  limp_:                [diagnostics]
  torque_rate:          [torque_arbitration, driveability, brake_blending]
  brake_release:        [brake_blending, torque_arbitration]
  r_est:                [charge_limit, regen]
  r_eol:                [charge_limit, regen]
  r_nom:                [charge_limit, regen]
  v_sop:                [charge_limit, regen]
  v_guard:              [voltage_guard]
  v_min_guard:          [voltage_guard]
  v_max_guard:          [voltage_guard]
  bat_derate:           [thermal_derating]
  inv_derate:           [thermal_derating]
  derate_floor:         [thermal_derating]
  dis_soc:              [discharge_limit]
  chg_soc:              [charge_limit, regen]
  cold:                 [cold, discharge_limit, charge_limit]
  regen_fade:           [regen, brake_blending]
  brake_force:          [brake_blending]
